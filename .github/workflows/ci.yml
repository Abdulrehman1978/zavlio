name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Fetch pinned Meta Automation source
        run: |
          git clone https://github.com/sunmughan/meta-automation.git external/meta-automation
          git -C external/meta-automation config core.autocrlf true
          git -C external/meta-automation checkout --detach 439c3bfaacb1caabef25a7d67c3f204916a5a168
          git -C external/meta-automation checkout-index --all --force
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:security:redaction
      - run: pnpm security:scan
      - run: pnpm env:check test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Install pinned adapter runtime dependencies
        working-directory: external/meta-automation
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --package-lock=false
          git checkout-index --all --force
      - name: Verify pinned Meta Automation source
        run: |
          git -C external/meta-automation status --porcelain --untracked-files=all
          sha256sum external/meta-automation/package-lock.json
          pnpm meta:verify-pin
      - run: pnpm test:integration:meta-adapter
      - run: pnpm test:integration:social-provider
      - name: Start Supabase for database-backed E2E
        run: pnpm db:start
      - name: Reset Supabase for database-backed E2E
        run: pnpm db:reset
      - name: Export local Supabase E2E credentials
        shell: bash
        run: |
          supabase_env="$(pnpm exec supabase status -o env)"
          get_value() {
            printf '%s\n' "$supabase_env" | sed -n "s/^$1=//p" | sed 's/^"//;s/"$//'
          }
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(get_value API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(get_value ANON_KEY)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(get_value SERVICE_ROLE_KEY)"
            echo "SUPABASE_JWT_SECRET=$(get_value JWT_SECRET)"
          } >> "$GITHUB_ENV"
      - run: pnpm test:e2e
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:start
      - run: pnpm db:reset
      - run: pnpm db:lint
      - run: pnpm db:test
      - run: pnpm db:types
      - shell: bash
        run: |
          first_hash=$(sha256sum packages/db/src/generated/database.types.ts | cut -d' ' -f1)
          pnpm db:types
          second_hash=$(sha256sum packages/db/src/generated/database.types.ts | cut -d' ' -f1)
          test "$first_hash" = "$second_hash"
          git diff --exit-code -- packages/db/src/generated/database.types.ts
