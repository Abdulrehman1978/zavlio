project_id = "zavlio-local"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
host = "127.0.0.1"
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/confirm", "http://localhost:3000/auth/confirm", "http://127.0.0.1:3000/auth/set-password", "http://localhost:3000/auth/set-password"]
enable_signup = false
enable_anonymous_sign_ins = false
enable_refresh_token_rotation = true

[auth.email]
enable_signup = false
enable_confirmations = true
secure_password_change = true

[analytics]
enabled = false
